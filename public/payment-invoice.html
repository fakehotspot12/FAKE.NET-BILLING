<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pembayaran Invoice - __FAKENET_META_TITLE__</title>
    __FAKENET_META_TAGS__
    <link id="appFavicon" rel="icon" href="__FAKENET_META_ICON__">
    <link rel="stylesheet" href="/payment-invoice.css?v=fakenet-billing-__FAKENET_APP_VERSION__-checkout-page-v6">
  </head>
  <body>
    <main class="payment-page">
      <section class="payment-card">
        <header class="payment-head">
          <img id="businessLogo" src="__FAKENET_META_ICON__" alt="">
          <div>
            <strong id="businessName">__FAKENET_META_TITLE__</strong>
            <span id="paymentLabel">Payment Gateway</span>
          </div>
        </header>

        <div id="paymentNotice" class="payment-notice" hidden></div>

        <section class="invoice-summary">
          <div>
            <span>No Invoice</span>
            <strong id="invoiceNo">-</strong>
          </div>
          <div>
            <span>Status</span>
            <strong id="invoiceStatus">-</strong>
          </div>
        </section>

        <section class="invoice-lines">
          <div>
            <span>Pelanggan</span>
            <strong id="customerName">-</strong>
          </div>
          <div id="paidMethodRow" hidden>
            <span>Metode Bayar</span>
            <strong id="paymentMethod">-</strong>
          </div>
          <div>
            <span>Paket</span>
            <strong id="packageName">-</strong>
          </div>
          <div>
            <span>Periode</span>
            <strong id="period">-</strong>
          </div>
          <div>
            <span>Jatuh Tempo</span>
            <strong id="dueDate">-</strong>
          </div>
          <div>
            <span>Add Ons</span>
            <strong id="addOns">-</strong>
          </div>
          <div>
            <span>PPN</span>
            <strong id="ppn">-</strong>
          </div>
          <div>
            <span>Diskon</span>
            <strong id="discount">-</strong>
          </div>
        </section>

        <section class="amount-box">
          <div>
            <span>Biaya</span>
            <strong id="amount">Rp. 0</strong>
          </div>
          <div id="adminFeeRow" hidden>
            <span>Fee</span>
            <strong id="adminFee">Rp. 0</strong>
          </div>
          <div class="total">
            <span id="gatewayAmountLabel">Total Bayar</span>
            <strong id="gatewayAmount">Rp. 0</strong>
          </div>
        </section>

        <section id="methodBox" class="method-box" hidden>
          <div class="method-box-head">
            <span>Pembayaran Online</span>
            <strong id="methodBoxTitle">Pilih Metode Pembayaran</strong>
          </div>
          <div id="pendingCheckoutBox" class="pending-checkout" hidden></div>
          <select id="paymentMethodSelect" class="payment-method-native" disabled aria-label="Metode pembayaran">
            <option value="">Memuat channel pembayaran...</option>
          </select>
          <div id="paymentMethodList" class="payment-method-list" role="listbox" aria-label="Daftar metode pembayaran" hidden></div>
          <small id="paymentMethodHelp">Pilih metode pembayaran yang tersedia dari Tripay.</small>
        </section>

        <button id="payButton" class="payment-button" type="button">Pilih Metode Pembayaran</button>
        <button id="refreshButton" class="secondary-button" type="button">Refresh Status</button>

        <section id="checkoutBox" class="checkout-modal" hidden></section>
      </section>
    </main>
    <script src="/payment-invoice.js?v=fakenet-billing-__FAKENET_APP_VERSION__-checkout-page-v6" defer></script>
  </body>
</html>
